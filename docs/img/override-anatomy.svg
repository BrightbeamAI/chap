<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="aRe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EA4700"/>
    </marker>
  </defs>

  <text x="600" y="54" text-anchor="middle" font-size="38" font-weight="700" fill="#111827">Anatomy of an override</text>
  <text x="600" y="92" text-anchor="middle" font-size="23" fill="#4b5563">every field is structured for query, not just storage</text>

  <g filter="url(#ds)">
    <rect x="40" y="116" width="700" height="764" rx="14" fill="#0f172a"/>
  </g>

  <text x="70" y="172" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#fdba74">decide.override</text>
  <line x1="70" y1="192" x2="710" y2="192" stroke="#334155" stroke-width="2"/>

  <g font-family="'Courier New', Courier, monospace" font-size="28">
    <text x="70" y="240" fill="#e5e7eb"><tspan fill="#fed7aa">"task_id"</tspan>: <tspan fill="#86efac">"tsk_pr_482"</tspan>,</text>
    <text x="70" y="302" fill="#e5e7eb"><tspan fill="#fed7aa">"from"</tspan>: <tspan fill="#86efac">"human:alice@acme.com"</tspan>,</text>
    <text x="70" y="364" fill="#e5e7eb"><tspan fill="#fed7aa">"logical_id"</tspan>: <tspan fill="#86efac">"lgl_pr_482_review"</tspan>,</text>
    <text x="70" y="426" fill="#e5e7eb"><tspan fill="#fed7aa">"intent_preserved"</tspan>: <tspan fill="#fca5a5">true</tspan>,</text>
    <text x="70" y="478" fill="#e5e7eb"><tspan fill="#fed7aa">"diff"</tspan>: [</text>
    <text x="98" y="518" fill="#e5e7eb">{ <tspan fill="#fed7aa">"op"</tspan>: <tspan fill="#86efac">"replace"</tspan>,</text>
    <text x="122" y="558" fill="#e5e7eb"><tspan fill="#fed7aa">"path"</tspan>: <tspan fill="#86efac">"/comments/0/severity"</tspan>,</text>
    <text x="122" y="598" fill="#e5e7eb"><tspan fill="#fed7aa">"value"</tspan>: <tspan fill="#86efac">"info"</tspan> }</text>
    <text x="70" y="638" fill="#e5e7eb">],</text>
    <text x="70" y="690" fill="#e5e7eb"><tspan fill="#fed7aa">"rationale"</tspan>:</text>
    <text x="98" y="730" fill="#86efac">"False positive: handlers</text>
    <text x="98" y="770" fill="#86efac">conform to a framework rule."<tspan fill="#e5e7eb">,</tspan></text>
    <text x="70" y="822" fill="#e5e7eb"><tspan fill="#fed7aa">"tags"</tspan>: [<tspan fill="#86efac">"false-positive"</tspan>,</text>
    <text x="98" y="862" fill="#86efac">"framework-pattern-misread"<tspan fill="#e5e7eb">]</tspan></text>
  </g>

  <g font-size="21" fill="#374151">
    <line x1="748" y1="234" x2="772" y2="234" stroke="#475569" stroke-width="3" marker-end="url(#aR)"/>
    <text x="786" y="230" font-weight="700" font-size="26" fill="#111827">Links to a review chain</text>
    <text x="786" y="258" fill="#4b5563">replay and audit any moment</text>

    <line x1="748" y1="296" x2="772" y2="296" stroke="#475569" stroke-width="3" marker-end="url(#aR)"/>
    <text x="786" y="292" font-weight="700" font-size="26" fill="#111827">Queryable identity</text>
    <text x="786" y="320" fill="#4b5563">pairs with security-signed/1.0</text>

    <line x1="748" y1="358" x2="772" y2="358" stroke="#475569" stroke-width="3" marker-end="url(#aR)"/>
    <text x="786" y="354" font-weight="700" font-size="26" fill="#111827">Survives revision</text>
    <text x="786" y="382" fill="#4b5563">edited again, still one id</text>

    <line x1="748" y1="420" x2="772" y2="420" stroke="#EA4700" stroke-width="3" marker-end="url(#aRe)"/>
    <text x="786" y="416" font-weight="700" font-size="26" fill="#9a3412">Refining vs substituting</text>
    <text x="786" y="444" fill="#4b5563">two failure modes, two fixes</text>

    <line x1="748" y1="512" x2="772" y2="512" stroke="#475569" stroke-width="3" marker-end="url(#aR)"/>
    <text x="786" y="508" font-weight="700" font-size="26" fill="#111827">RFC 6902 JSON Patch</text>
    <text x="786" y="536" fill="#4b5563">reversible, no custom format</text>

    <line x1="748" y1="684" x2="772" y2="684" stroke="#475569" stroke-width="3" marker-end="url(#aR)"/>
    <text x="786" y="680" font-weight="700" font-size="26" fill="#111827">"Why", alongside "what"</text>
    <text x="786" y="708" fill="#4b5563">searchable, trains the next</text>
    <text x="786" y="734" fill="#4b5563">prompt revision</text>

    <line x1="748" y1="816" x2="772" y2="816" stroke="#EA4700" stroke-width="3" marker-end="url(#aRe)"/>
    <text x="786" y="812" font-weight="700" font-size="26" fill="#9a3412">Supervision data</text>
    <text x="786" y="840" fill="#4b5563">aggregate, then tune prompts</text>
  </g>

  <text x="600" y="926" text-anchor="middle" font-size="21" fill="#4b5563" font-style="italic">Identity profiles add signatures; audit-scitt/1.0 anchors the chain to a transparency log.</text>
</svg>
