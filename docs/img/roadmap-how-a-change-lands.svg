<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-labelledby="title desc"><title id="title">How a change becomes part of CHAP</title><desc id="desc">1. Raise it: Open an issue or a discussion. 2. Write a CEP: The change, its reasons and how it will be tested. 3. Discuss: Anyone can comment: fourteen days for Core, seven for a profile. 4. Build and test: A working implementation passes the conformance tests. 5. Decide: Accepted or rejected, with the reasons on record. 6. Release: With a changelog and migration notes, under one tag.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f4f52"/></marker></defs><rect x="1.0" y="1.0" width="1198.0" height="398.0" rx="18" fill="#FFF8F2" stroke="#d5d5d8" stroke-width="2"/><text x="48.0" y="64.0" font-size="32" fill="#1a1a1c" font-weight="700">How a change becomes part of CHAP</text><text x="48.0" y="97.0" font-size="19" fill="#4f4f52">From 0.4, a change to the message format, a method, a profile, a maturity level or a deprecation goes through a CEP.</text><line x1="128" y1="172" x2="1072" y2="172" stroke="#d5d5d8" stroke-width="6" stroke-linecap="round"/><circle cx="128.0" cy="172" r="28" fill="#EA4700"/><text x="128.0" y="179.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="128.0" y="234.0" font-size="18" fill="#1a1a1c" font-weight="700" text-anchor="middle">Raise it</text><text x="128.0" y="260.0" font-size="15" fill="#4f4f52" text-anchor="middle">Open an issue or a</text><text x="128.0" y="279.0" font-size="15" fill="#4f4f52" text-anchor="middle">discussion.</text><circle cx="316.8" cy="172" r="28" fill="#EA4700"/><text x="316.8" y="179.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="316.8" y="234.0" font-size="18" fill="#1a1a1c" font-weight="700" text-anchor="middle">Write a CEP</text><text x="316.8" y="260.0" font-size="15" fill="#4f4f52" text-anchor="middle">The change, its reasons</text><text x="316.8" y="279.0" font-size="15" fill="#4f4f52" text-anchor="middle">and how it will be tested.</text><circle cx="505.6" cy="172" r="28" fill="#EA4700"/><text x="505.6" y="179.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="505.6" y="234.0" font-size="18" fill="#1a1a1c" font-weight="700" text-anchor="middle">Discuss</text><text x="505.6" y="260.0" font-size="15" fill="#4f4f52" text-anchor="middle">Anyone can comment:</text><text x="505.6" y="279.0" font-size="15" fill="#4f4f52" text-anchor="middle">fourteen days for Core,</text><text x="505.6" y="298.0" font-size="15" fill="#4f4f52" text-anchor="middle">seven for a profile.</text><circle cx="694.4" cy="172" r="28" fill="#EA4700"/><text x="694.4" y="179.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="694.4" y="234.0" font-size="18" fill="#1a1a1c" font-weight="700" text-anchor="middle">Build and test</text><text x="694.4" y="260.0" font-size="15" fill="#4f4f52" text-anchor="middle">A working</text><text x="694.4" y="279.0" font-size="15" fill="#4f4f52" text-anchor="middle">implementation passes</text><text x="694.4" y="298.0" font-size="15" fill="#4f4f52" text-anchor="middle">the conformance tests.</text><circle cx="883.2" cy="172" r="28" fill="#EA4700"/><text x="883.2" y="179.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="883.2" y="234.0" font-size="18" fill="#1a1a1c" font-weight="700" text-anchor="middle">Decide</text><text x="883.2" y="260.0" font-size="15" fill="#4f4f52" text-anchor="middle">Accepted or rejected,</text><text x="883.2" y="279.0" font-size="15" fill="#4f4f52" text-anchor="middle">with the reasons on</text><text x="883.2" y="298.0" font-size="15" fill="#4f4f52" text-anchor="middle">record.</text><circle cx="1072.0" cy="172" r="28" fill="#EA4700"/><text x="1072.0" y="179.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="1072.0" y="234.0" font-size="18" fill="#1a1a1c" font-weight="700" text-anchor="middle">Release</text><text x="1072.0" y="260.0" font-size="15" fill="#4f4f52" text-anchor="middle">With a changelog and</text><text x="1072.0" y="279.0" font-size="15" fill="#4f4f52" text-anchor="middle">migration notes, under</text><text x="1072.0" y="298.0" font-size="15" fill="#4f4f52" text-anchor="middle">one tag.</text><circle cx="56" cy="361" r="6" fill="#EA4700"/><text x="72.0" y="366.0" font-size="17" fill="#4f4f52">A security fix can ship first and be recorded in a CEP afterwards.</text></svg>
