<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="1200" height="930" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-labelledby="title desc"><title id="title">Six tracks of work across the milestones</title><desc id="desc">Protocol: 0.3 Documents match the code; refusals recorded; 0.4 Message format, version, chain, participant names; 0.5 Levels, one Core, unbuilt methods decided; 0.6 Admission, export, retention; 0.7 Fixes from traceability and interop; 1.0-rc Feature freeze. Engineering: 0.3 0.3.0 and the versioning rules; 0.4 Version declaration, release checks; 0.5 Generated types, A2A 1.0 adapter; 0.6 Offline verifiers, signed calls in the fuzzer; 0.7 Packaged kit, implementer's guide; 1.0-rc Release candidates. Conformance: 0.3 Checklist fixes, refusal vectors; 0.4 Requirement IDs, conformance by profile; 0.5 Levels checked in the build; 0.6 Kit tests for admission; 0.7 Traceability, canonical JSON check, first interop event; 1.0-rc Independent implementations pass the kit. Security: 0.3 SECURITY.md rewritten, reviewer agreed; 0.4 Signing and key rules, hash coverage; 0.5 Stored before answered, safe retries; 0.6 Admission, redaction, refusal limits; 0.7 External review, wider fuzzing; 1.0-rc Review findings closed. Governance: 0.3 Governance as practised, licence terms, CEP-001; 0.4 A CEP for every Core change; 0.5 Stability policy, patent commitment; 0.6 Maintainer from a second organisation; 0.7 Options for a long-term home; 1.0-rc Home decided, committee trigger. Ecosystem: 0.3 Roadmap published, SCITT cites RFC 9943; 0.4 Versioning in step with MCP, outreach begins; 0.5 Naming rules for outside profiles; 0.6 Export format for outside verifiers; 0.7 A2A extension and AG-UI mapping drafts; 1.0-rc Second interop event.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f4f52"/></marker></defs><rect