<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-labelledby="title desc"><title id="title">Where CHAP fits</title><desc id="desc">A CHAP coordinator and its audit log sit at the centre. Available today: people and front ends reach it over HTTP, AI agents and tools use it as an MCP server, other agents work with it as an A2A agent, agent frameworks reach it through Python bridges, transparency services receive SCITT statements through a hook each deployment supplies, and chap-analytics reads the log. Planned: AG-UI interrupts for people and front ends, and an A2A extension.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f4f52"/></marker></defs><rect x="1.0" y="1.0" width="1198.0" height="758.0" rx="18" fill="#FFF8F2" stroke="#d5d5d8" stroke-width="2"/><text x="48.0" y="64.0" font-size="32" fill="#1a1a1c" font-weight="700">Where CHAP fits</text><text x="48.0" y="97.0" font-size="19" fill="#4f4f52">CHAP keeps the record of human decisions in work that agents do.</text><line x1="600.0" y1="218.0" x2="600.0" y2="268.0" stroke="#EA4700" stroke-width="2.6"/><rect x="541.8" y="228.0" width="116.3" height="30.0" rx="8" fill="#FFF8F2" stroke="#EA4700" stroke-width="1.2"/><text x="600.0" y="248.0" font-size="15" fill="#1a1a1c" font-weight="700" text-anchor="middle">Reads the log</text><line x1="288.0" y1="328.0" x2="450.0" y2="328.0" stroke="#EA4700" stroke-width="2.6"/><rect x="318.9" y="313.0" width="100.3" height="30.0" rx="8" fill="#FFF8F2" stroke="#EA4700" stroke-width="1.2"/><text x="369.0" y="333.0" font-size="15" fill="#1a1a1c" font-weight="700" text-anchor="middle">MCP server</text><line x1="288.0" y1="440.0" x2="450.0" y2="440.0" stroke="#EA4700" stroke-width="2.6"/><rect x="323.2" y="425.0" width="91.6" height="30.0" rx="8" fill="#FFF8F2" stroke="#EA4700" stroke-width="1.2"/><text x="369.0" y="445.0" font-size="15" fill="#1a1a1c" font-weight="700" text-anchor="middle">A2A agent</text><line x1="288.0" y1="502.0" x2="450.0" y2="502.0" stroke="#4f4f52" stroke-width="2.6" stroke-dasharray="8 7"/><rect x="308.2" y="479.0" width="121.6" height="46.0" rx="8" fill="#FFF8F2" stroke="#4f4f52" stroke-width="1.2" stroke-dasharray="5 4"/><text x="369.0" y="499.0" font-size="15" fill="#1a1a1c" font-weight="700" text-anchor="middle">A2A extension</text><text x="369.0" y="517.0" font-size="15" fill="#4f4f52" text-anchor="middle">planned</text><line x1="750.0" y1="302.0" x2="912.0" y2="302.0" stroke="#EA4700" stroke-width="2.6"/><rect x="802.4" y="287.0" width="57.2" height="30.0" rx="8" fill="#FFF8F2" stroke="#EA4700" stroke-width="1.2"/><text x="831.0" y="307.0" font-size="15" fill="#1a1a1c" font-weight="700" text-anchor="middle">HTTP</text><line x1="750.0" y1="356.0" x2="912.0" y2="356.0" stroke="#4f4f52" stroke-width="2.6" stroke-dasharray="8 7"/><rect x="763.7" y="333.0" width="134.7" height="46.0" rx="8" fill="#FFF8F2" stroke="#4f4f52" stroke-width="1.2" stroke-dasharray="5 4"/><text x="831.0" y="353.0" font-size="15" fill="#1a1a1c" font-weight="700" text-anchor="middle">AG-UI interrupts</text><text x="831.0" y="371.0" font-size="15" fill="#4f4f52" text-anchor="middle">planned</text><line x1="750.0" y1="471.0" x2="912.0" y2="471.0" stroke="#EA4700" stroke-width="2.6"/><rect x="758.7" y="448.0" width="144.7" height="46.0" rx="8" fill="#FFF8F2" stroke="#EA4700" stroke-width="1.2"/><text x="831.0" y="468.0" font-size="15" fill="#1a1a1c" font-weight="700" text-anchor="middle">SCITT statements</text><text x="831.0" y="486.0" font-size="15" fill="#4f4f52" text-anchor="middle">through a hook</text><line x1="600.0" y1="538.0" x2="600.0" y2="612.0" stroke="#EA4700" stroke-width="2.6"/><rect x="536.4" y="560.0" width="127.2" height="30.0" rx="8" fill="#FFF8F2" stroke="#EA4700" stroke-width="1.2"/><text x="600.0" y="580.0" font-size="15" fill="#1a1a1c" font-weight="700" text-anchor="middle">Python bridges</text><rect x="450.0" y="268.0" width="300.0" height="270.0" rx="16" fill="#ffffff" stroke="#EA4700" stroke-width="2.5"/><path d="M466.0 268h268a16 16 0 0 1 16 16v40h-300v-40a16 16 0 0 1 16 -16z" fill="#EA4700"/><text x="600.0" y="305.0" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">CHAP coordinator</text><text x="600.0" y="377.5" font-size="16" fill="#4f4f52" text-anchor="middle">Runs workspaces: tasks, reviews,</text><text x="600.0" y="397.5" font-size="16" fill="#4f4f52" text-anchor="middle">questions and decisions</text><rect x="479.0" y="415.5" width="38.0" height="28.0" rx="6" fill="#FFE7DD" stroke="#EA4700" stroke-width="1.8"/><line x1="517.0" y1="429.5" x2="530.0" y2="429.5" stroke="#EA4700" stroke-width="2.4"/><rect x="530.0" y="415.5" width="38.0" height="28.0" rx="6" fill="#FFE7DD" stroke="#EA4700" stroke-width="1.8"/><line x1="568.0" y1="429.5" x2="581.0" y2="429.5" stroke="#EA4700" stroke-width="2.4"/><rect x="581.0" y="415.5" width="38.0" height="28.0" rx="6" fill="#FFE7DD" stroke="#EA4700" stroke-width="1.8"/><line x1="619.0" y1="429.5" x2="632.0" y2="429.5" stroke="#EA4700" stroke-width="2.4"/><rect x="632.0" y="415.5" width="38.0" height="28.0" rx="6" fill="#FFE7DD" stroke="#EA4700" stroke-width="1.8"/><line x1="670.0" y1="429.5" x2="683.0" y2="429.5" stroke="#EA4700" stroke-width="2.4"/><rect x="683.0" y="415.5" width="38.0" height="28.0" rx="6" fill="#ffffff" stroke="#EA4700" stroke-width="1.8"/><text x="600.0" y="469.5" font-size="15" fill="#4f4f52" text-anchor="middle">With the chain on, each entry links to</text><text x="600.0" y="488.5" font-size="15" fill="#4f4f52" text-anchor="middle">the one before</text><rect x="410.0" y="128.0" width="380.0" height="90.0" rx="14" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="428.0" y="160.0" font-size="18" fill="#1a1a1c" font-weight="700">Analysis</text><text x="428.0" y="184.0" font-size="15" fill="#4f4f52">chap-analytics reads the log as tables and charts.</text><rect x="48.0" y="272.0" width="240.0" height="112.0" rx="14" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="66.0" y="304.0" font-size="18" fill="#1a1a1c" font-weight="700">AI agents and tools</text><text x="66.0" y="328.0" font-size="15" fill="#4f4f52">Open tasks, request reviews</text><text x="66.0" y="347.0" font-size="15" fill="#4f4f52">and read the log.</text><rect x="48.0" y="404.0" width="240.0" height="134.0" rx="14" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="66.0" y="436.0" font-size="18" fill="#1a1a1c" font-weight="700">Other agents</text><text x="66.0" y="460.0" font-size="15" fill="#4f4f52">Work with CHAP as a peer</text><text x="66.0" y="479.0" font-size="15" fill="#4f4f52">agent.</text><rect x="912.0" y="272.0" width="240.0" height="112.0" rx="14" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="930.0" y="304.0" font-size="18" fill="#1a1a1c" font-weight="700">People and front ends</text><text x="930.0" y="328.0" font-size="15" fill="#4f4f52">Answer reviews and questions</text><text x="930.0" y="347.0" font-size="15" fill="#4f4f52">as they arise.</text><rect x="912.0" y="404.0" width="240.0" height="134.0" rx="14" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="930.0" y="436.0" font-size="18" fill="#1a1a1c" font-weight="700">Transparency services</text><text x="930.0" y="460.0" font-size="15" fill="#4f4f52">Register a statement for each</text><text x="930.0" y="479.0" font-size="15" fill="#4f4f52">entry and return a receipt.</text><rect x="370.0" y="612.0" width="460.0" height="84.0" rx="14" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="388.0" y="644.0" font-size="18" fill="#1a1a1c" font-weight="700">Agent frameworks</text><text x="388.0" y="668.0" font-size="15" fill="#4f4f52">LangGraph, Pydantic AI, LlamaIndex, AG2 and Google ADK.</text><line x1="48" y1="726" x2="96" y2="726" stroke="#EA4700" stroke-width="3"/><text x="106.0" y="732.0" font-size="17" fill="#4f4f52">Available today</text><line x1="256.98375" y1="726" x2="304.98375" y2="726" stroke="#4f4f52" stroke-width="3" stroke-dasharray="8 7"/><text x="315.0" y="732.0" font-size="17" fill="#4f4f52">Planned</text></svg>
