<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-labelledby="title desc"><title id="title">How parts of CHAP mature</title><desc id="desc">Draft, then Candidate, Stable, Deprecated and Removed. A Draft part can also be removed directly through a CEP. To Candidate: An accepted CEP, Built in both coordinators, A kit test or recorded exclusion for every requirement, A complete profile document. To Stable: One release cycle with no breaking change, Full kit coverage, Used outside Brightbeam, Security review where it applies. To Deprecated: A CEP with the reason, A migration path, Any replacement already Stable. To Removed: At least twelve months' notice, Stable parts leave in a major release, Ninety days for an unfixed security risk.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f4f52"/></marker></defs><rect x="1.0" y="1.0" width="1198.0" height="618.0" rx="18" fill="#FFF8F2" stroke="#d5d5d8" stroke-width="2"/><text x="48.0" y="64.0" font-size="32" fill="#1a1a1c" font-weight="700">How parts of CHAP mature</text><text x="48.0" y="97.0" font-size="19" fill="#4f4f52">Every method, profile, binding and error code carries one of five levels.</text><path d="M140.0 196 C140.0 124 1060.0 124 1060.0 194" fill="none" stroke="#4f4f52" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="433.3" y="127.0" width="333.5" height="30.0" rx="8" fill="#FFF8F2" stroke="none" stroke-width="0"/><text x="600.0" y="148.0" font-size="16" fill="#4f4f52" text-anchor="middle">A Draft part can be removed through a CEP</text><rect x="48.0" y="200.0" width="184.0" height="122.0" rx="14" fill="#ffffff" stroke="#8a8a8d" stroke-width="2.5" stroke-dasharray="6 5"/><text x="140.0" y="236.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">Draft</text><text x="140.0" y="262.0" font-size="15" fill="#4f4f52" text-anchor="middle">Proposed, possibly</text><text x="140.0" y="281.0" font-size="15" fill="#4f4f52" text-anchor="middle">built. Anything can</text><text x="140.0" y="300.0" font-size="15" fill="#4f4f52" text-anchor="middle">change.</text><line x1="238.0" y1="261.0" x2="270.0" y2="261.0" stroke="#4f4f52" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="278.0" y="200.0" width="184.0" height="122.0" rx="14" fill="#FFF0D9" stroke="#FF9900" stroke-width="2.5"/><text x="370.0" y="236.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">Candidate</text><text x="370.0" y="262.0" font-size="15" fill="#4f4f52" text-anchor="middle">Design complete and</text><text x="370.0" y="281.0" font-size="15" fill="#4f4f52" text-anchor="middle">tested. Breaking</text><text x="370.0" y="300.0" font-size="15" fill="#4f4f52" text-anchor="middle">changes by CEP.</text><line x1="468.0" y1="261.0" x2="500.0" y2="261.0" stroke="#4f4f52" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="508.0" y="200.0" width="184.0" height="122.0" rx="14" fill="#E8F1ED" stroke="#1f5b39" stroke-width="2.5"/><text x="600.0" y="236.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">Stable</text><text x="600.0" y="262.0" font-size="15" fill="#4f4f52" text-anchor="middle">Covered by the 1.x</text><text x="600.0" y="281.0" font-size="15" fill="#4f4f52" text-anchor="middle">promise. Additions only.</text><line x1="698.0" y1="261.0" x2="730.0" y2="261.0" stroke="#4f4f52" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="738.0" y="200.0" width="184.0" height="122.0" rx="14" fill="#f0f0f2" stroke="#4f4f52" stroke-width="2.5"/><text x="830.0" y="236.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">Deprecated</text><text x="830.0" y="262.0" font-size="15" fill="#4f4f52" text-anchor="middle">Still works, with a</text><text x="830.0" y="281.0" font-size="15" fill="#4f4f52" text-anchor="middle">migration path.</text><line x1="928.0" y1="261.0" x2="960.0" y2="261.0" stroke="#4f4f52" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="968.0" y="200.0" width="184.0" height="122.0" rx="14" fill="#ffffff" stroke="#d5d5d8" stroke-width="2.5"/><text x="1060.0" y="236.0" font-size="21" fill="#4f4f52" font-weight="700" text-anchor="middle">Removed</text><text x="1060.0" y="262.0" font-size="15" fill="#4f4f52" text-anchor="middle">Gone from the current</text><text x="1060.0" y="281.0" font-size="15" fill="#4f4f52" text-anchor="middle">revision.</text><line x1="255.0" y1="265.0" x2="255.0" y2="368" stroke="#d5d5d8" stroke-width="2" stroke-dasharray="3 4"/><rect x="148.0" y="368.0" width="214.0" height="218.0" rx="12" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="164.0" y="397.0" font-size="17" fill="#C73D00" font-weight="700">To Candidate</text><circle cx="168.0" cy="419" r="3.2" fill="#4f4f52"/><text x="180.0" y="424.0" font-size="15" fill="#1a1a1c">An accepted CEP</text><circle cx="168.0" cy="445" r="3.2" fill="#4f4f52"/><text x="180.0" y="450.0" font-size="15" fill="#1a1a1c">Built in both coordinators</text><circle cx="168.0" cy="471" r="3.2" fill="#4f4f52"/><text x="180.0" y="476.0" font-size="15" fill="#1a1a1c">A kit test or recorded</text><text x="180.0" y="495.0" font-size="15" fill="#1a1a1c">exclusion for every</text><text x="180.0" y="514.0" font-size="15" fill="#1a1a1c">requirement</text><circle cx="168.0" cy="535" r="3.2" fill="#4f4f52"/><text x="180.0" y="540.0" font-size="15" fill="#1a1a1c">A complete profile</text><text x="180.0" y="559.0" font-size="15" fill="#1a1a1c">document</text><line x1="485.0" y1="265.0" x2="485.0" y2="368" stroke="#d5d5d8" stroke-width="2" stroke-dasharray="3 4"/><rect x="378.0" y="368.0" width="214.0" height="218.0" rx="12" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="394.0" y="397.0" font-size="17" fill="#C73D00" font-weight="700">To Stable</text><circle cx="398.0" cy="419" r="3.2" fill="#4f4f52"/><text x="410.0" y="424.0" font-size="15" fill="#1a1a1c">One release cycle with</text><text x="410.0" y="443.0" font-size="15" fill="#1a1a1c">no breaking change</text><circle cx="398.0" cy="464" r="3.2" fill="#4f4f52"/><text x="410.0" y="469.0" font-size="15" fill="#1a1a1c">Full kit coverage</text><circle cx="398.0" cy="490" r="3.2" fill="#4f4f52"/><text x="410.0" y="495.0" font-size="15" fill="#1a1a1c">Used outside</text><text x="410.0" y="514.0" font-size="15" fill="#1a1a1c">Brightbeam</text><circle cx="398.0" cy="535" r="3.2" fill="#4f4f52"/><text x="410.0" y="540.0" font-size="15" fill="#1a1a1c">Security review where it</text><text x="410.0" y="559.0" font-size="15" fill="#1a1a1c">applies</text><line x1="715.0" y1="265.0" x2="715.0" y2="368" stroke="#d5d5d8" stroke-width="2" stroke-dasharray="3 4"/><rect x="608.0" y="368.0" width="214.0" height="218.0" rx="12" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="624.0" y="397.0" font-size="17" fill="#C73D00" font-weight="700">To Deprecated</text><circle cx="628.0" cy="419" r="3.2" fill="#4f4f52"/><text x="640.0" y="424.0" font-size="15" fill="#1a1a1c">A CEP with the reason</text><circle cx="628.0" cy="445" r="3.2" fill="#4f4f52"/><text x="640.0" y="450.0" font-size="15" fill="#1a1a1c">A migration path</text><circle cx="628.0" cy="471" r="3.2" fill="#4f4f52"/><text x="640.0" y="476.0" font-size="15" fill="#1a1a1c">Any replacement already</text><text x="640.0" y="495.0" font-size="15" fill="#1a1a1c">Stable</text><line x1="945.0" y1="265.0" x2="945.0" y2="368" stroke="#d5d5d8" stroke-width="2" stroke-dasharray="3 4"/><rect x="838.0" y="368.0" width="214.0" height="218.0" rx="12" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.5"/><text x="854.0" y="397.0" font-size="17" fill="#C73D00" font-weight="700">To Removed</text><circle cx="858.0" cy="419" r="3.2" fill="#4f4f52"/><text x="870.0" y="424.0" font-size="15" fill="#1a1a1c">At least twelve months'</text><text x="870.0" y="443.0" font-size="15" fill="#1a1a1c">notice</text><circle cx="858.0" cy="464" r="3.2" fill="#4f4f52"/><text x="870.0" y="469.0" font-size="15" fill="#1a1a1c">Stable parts leave in a</text><text x="870.0" y="488.0" font-size="15" fill="#1a1a1c">major release</text><circle cx="858.0" cy="509" r="3.2" fill="#4f4f52"/><text x="870.0" y="514.0" font-size="15" fill="#1a1a1c">Ninety days for an</text><text x="870.0" y="533.0" font-size="15" fill="#1a1a1c">unfixed security risk</text></svg>
