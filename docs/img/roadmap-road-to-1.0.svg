<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-labelledby="title desc"><title id="title">The road to CHAP 1.0</title><desc id="desc">Milestones in order: 0.2 public draft (released), 0.3 the documents match the code (in progress), 0.4 one wire, one version, one chain, 0.5 a settled surface, 0.6 trust and authority, 0.7 tested from outside, 1.0-rc freeze and verify, and 1.0 release.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f4f52"/></marker></defs><rect x="1.0" y="1.0" width="1198.0" height="498.0" rx="18" fill="#FFF8F2" stroke="#d5d5d8" stroke-width="2"/><text x="48.0" y="64.0" font-size="32" fill="#1a1a1c" font-weight="700">The road to CHAP 1.0</text><text x="48.0" y="97.0" font-size="19" fill="#4f4f52">Each milestone finishes when its checks pass.</text><line x1="110" y1="276" x2="1090" y2="276" stroke="#d5d5d8" stroke-width="14" stroke-linecap="round"/><line x1="110.0" y1="276" x2="250.0" y2="276" stroke="#EA4700" stroke-width="14" stroke-linecap="round" stroke-dasharray="20 14"/><circle cx="110.0" cy="276" r="31" fill="#1f5b39"/><text x="110.0" y="283.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">0.2</text><text x="110.0" y="191.0" font-size="15" fill="#1f5b39" font-weight="700" text-anchor="middle" letter-spacing="1.6">RELEASED</text><text x="110.0" y="219.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">Public draft</text><circle cx="250.0" cy="276" r="31" fill="#ffffff" stroke="#EA4700" stroke-width="5"/><text x="250.0" y="283.0" font-size="20" fill="#EA4700" font-weight="700" text-anchor="middle">0.3</text><text x="250.0" y="343.0" font-size="15" fill="#EA4700" font-weight="700" text-anchor="middle" letter-spacing="1.6">IN PROGRESS</text><text x="250.0" y="371.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">The documents</text><text x="250.0" y="397.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">match the code</text><circle cx="390.0" cy="276" r="31" fill="#ffffff" stroke="#4f4f52" stroke-width="2.5"/><text x="390.0" y="283.0" font-size="20" fill="#1a1a1c" font-weight="700" text-anchor="middle">0.4</text><text x="390.0" y="165.0" font-size="15" fill="#4f4f52" font-weight="700" text-anchor="middle" letter-spacing="1.6">PLANNED</text><text x="390.0" y="193.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">One wire, one version,</text><text x="390.0" y="219.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">one chain</text><circle cx="530.0" cy="276" r="31" fill="#ffffff" stroke="#4f4f52" stroke-width="2.5"/><text x="530.0" y="283.0" font-size="20" fill="#1a1a1c" font-weight="700" text-anchor="middle">0.5</text><text x="530.0" y="343.0" font-size="15" fill="#4f4f52" font-weight="700" text-anchor="middle" letter-spacing="1.6">PLANNED</text><text x="530.0" y="371.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">A settled surface</text><circle cx="670.0" cy="276" r="31" fill="#ffffff" stroke="#4f4f52" stroke-width="2.5"/><text x="670.0" y="283.0" font-size="20" fill="#1a1a1c" font-weight="700" text-anchor="middle">0.6</text><text x="670.0" y="191.0" font-size="15" fill="#4f4f52" font-weight="700" text-anchor="middle" letter-spacing="1.6">PLANNED</text><text x="670.0" y="219.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">Trust and authority</text><circle cx="810.0" cy="276" r="31" fill="#ffffff" stroke="#4f4f52" stroke-width="2.5"/><text x="810.0" y="283.0" font-size="20" fill="#1a1a1c" font-weight="700" text-anchor="middle">0.7</text><text x="810.0" y="343.0" font-size="15" fill="#4f4f52" font-weight="700" text-anchor="middle" letter-spacing="1.6">PLANNED</text><text x="810.0" y="371.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">Tested from outside</text><circle cx="950.0" cy="276" r="31" fill="#ffffff" stroke="#4f4f52" stroke-width="2.5"/><text x="950.0" y="283.0" font-size="16" fill="#1a1a1c" font-weight="700" text-anchor="middle">1.0-rc</text><text x="950.0" y="191.0" font-size="15" fill="#4f4f52" font-weight="700" text-anchor="middle" letter-spacing="1.6">PLANNED</text><text x="950.0" y="219.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">Freeze and verify</text><line x1="1090.0" y1="245" x2="1090.0" y2="199" stroke="#1a1a1c" stroke-width="3"/><path d="M1090.0 199 L1124.0 208 L1090.0 217 Z" fill="#EA4700"/><circle cx="1090.0" cy="276" r="31" fill="#FF9900"/><text x="1090.0" y="283.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">1.0</text><text x="1090.0" y="343.0" font-size="15" fill="#1a1a1c" font-weight="700" text-anchor="middle" letter-spacing="1.6">THE GOAL</text><text x="1090.0" y="371.0" font-size="21" fill="#1a1a1c" font-weight="700" text-anchor="middle">Release</text><circle cx="57" cy="459" r="9" fill="#1f5b39"/><text x="74.0" y="464.0" font-size="17" fill="#4f4f52">Released</text><circle cx="188.82234375000002" cy="459" r="8" fill="#ffffff" stroke="#EA4700" stroke-width="3"/><text x="205.8" y="464.0" font-size="17" fill="#4f4f52">In progress</text><circle cx="333.856875" cy="459" r="8" fill="#ffffff" stroke="#4f4f52" stroke-width="3"/><text x="350.9" y="464.0" font-size="17" fill="#4f4f52">Planned</text><circle cx="456.2415625" cy="459" r="9" fill="#FF9900"/><text x="473.2" y="464.0" font-size="17" fill="#4f4f52">The goal</text><text x="1152.0" y="464.0" font-size="17" fill="#4f4f52" text-anchor="end">Milestones are shown in the order they happen.</text></svg>
