<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 679" width="1200" height="679" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-labelledby="title desc"><title id="title">Known gaps by milestone</title><desc id="desc">0.3: Governance documents. 0.4: Two message descriptions; No version on requests; Optional, partial chain; Conformance levels; Participant names. 0.5: Two lists of Core methods; No maturity labels; Safe retries; Calls answered, never stored; A2A adapter on A2A 0.3; Patent commitment. 0.6: Unbuilt methods (from 0.5); Anyone can join; Refusal records; One maintaining organisation. 0.7: Test coverage (from 0.4). 1.0-rc: Implementations from one team (from 0.7); No outside security review (from 0.7). After 1.0: Known security limits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f4f52"/></marker></defs><rect x="1.0" y="1.0" width="1198.0" height="677.0" rx="18" fill="#FFF8F2" stroke="#d5d5d8" stroke-width="2"/><text x="48.0" y="64.0" font-size="32" fill="#1a1a1c" font-weight="700">Known gaps by milestone</text><text x="48.0" y="97.0" font-size="19" fill="#4f4f52">Each gap sits under the milestone that closes it. Known security limits become Draft profiles after 1.0.</text><rect x="48.0" y="228.0" width="149.1" height="375.0" rx="12" fill="#FFE7DD" stroke="none" stroke-width="0"/><rect x="48.0" y="130.0" width="149.1" height="88.0" rx="12" fill="#EA4700" stroke="#EA4700" stroke-width="0"/><text x="122.6" y="164.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">0.3</text><text x="122.6" y="189.0" font-size="15" fill="#ffffff" text-anchor="middle">The documents</text><text x="122.6" y="208.0" font-size="15" fill="#ffffff" text-anchor="middle">match the code</text><rect x="55.0" y="235.0" width="135.1" height="54.0" rx="8" fill="#ffffff" stroke="#d5d5d8" stroke-width="1.2"/><text x="65