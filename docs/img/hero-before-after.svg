<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bgChaos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3f2"/>
      <stop offset="100%" stop-color="#fee4e2"/>
    </linearGradient>
    <linearGradient id="bgClean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <marker id="arrowEmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="600" y="44" text-anchor="middle" font-size="34" font-weight="700" fill="#0f172a">Same scenario, two stacks</text>
  <text x="600" y="76" text-anchor="middle" font-size="20" font-weight="500" fill="#334155">a customer disputes a refund the agent decided last month</text>

  <rect x="28" y="96" width="560" height="520" rx="14" fill="url(#bgChaos)" stroke="#f87171" stroke-width="2"/>
  <text x="308" y="138" text-anchor="middle" font-size="24" font-weight="800" fill="#7f1d1d" letter-spacing="2.5">WITHOUT CHAP</text>

  <g>
    <text x="56" y="196" font-size="22" font-weight="700" fill="#0f172a">OpenAI logs</text>
    <text x="560" y="196" text-anchor="end" font-size="21" font-weight="700" fill="#b91c1c">expired after 30 days</text>
    <line x1="56" y1="212" x2="560" y2="212" stroke="#fca5a5" stroke-width="1.5"/>

    <text x="56" y="244" font-size="22" font-weight="700" fill="#0f172a">Zendesk thread</text>
    <text x="560" y="244" text-anchor="end" font-size="21" font-weight="700" fill="#b91c1c">final reply only</text>
    <line x1="56" y1="260" x2="560" y2="260" stroke="#fca5a5" stroke-width="1.5"/>

    <text x="56" y="292" font-size="22" font-weight="700" fill="#0f172a">Slack #support</text>
    <text x="560" y="292" text-anchor="end" font-size="21" font-weight="700" fill="#b91c1c">scrolled past</text>
    <line x1="56" y1="308" x2="560" y2="308" stroke="#fca5a5" stroke-width="1.5"/>

    <text x="56" y="340" font-size="22" font-weight="700" fill="#0f172a">Linear comments</text>
    <text x="560" y="340" text-anchor="end" font-size="21" font-weight="700" fill="#b91c1c">no rationale</text>
    <line x1="56" y1="356" x2="560" y2="356" stroke="#fca5a5" stroke-width="1.5"/>

    <text x="56" y="388" font-size="22" font-weight="700" fill="#0f172a">webhook tail</text>
    <text x="560" y="388" text-anchor="end" font-size="21" font-weight="700" fill="#b91c1c">keys rotated</text>
    <line x1="56" y1="404" x2="560" y2="404" stroke="#fca5a5" stroke-width="1.5"/>

    <text x="56" y="436" font-size="22" font-weight="700" fill="#0f172a">Notion runbook</text>
    <text x="560" y="436" text-anchor="end" font-size="21" font-weight="700" fill="#b91c1c">stale by Tuesday</text>
  </g>

  <rect x="56" y="462" width="504" height="88" rx="10" fill="#7f1d1d"/>
  <text x="308" y="494" text-anchor="middle" font-size="18" font-weight="700" fill="#fecaca" letter-spacing="2.5">TIME TO ANSWER</text>
  <text x="308" y="536" text-anchor="middle" font-size="42" font-weight="800" fill="#fff">~45 minutes</text>

  <text x="308" y="588" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937" font-style="italic">"What did the agent draft? Why did we approve it?"</text>

  <rect x="612" y="96" width="560" height="520" rx="14" fill="url(#bgClean)" stroke="#f97316" stroke-width="2"/>
  <text x="892" y="138" text-anchor="middle" font-size="24" font-weight="800" fill="#7c2d12" letter-spacing="2.5">WITH CHAP</text>

  <g filter="url(#softShadow)">
    <rect x="640" y="164" width="504" height="58" rx="10" fill="#fff"/>
    <text x="662" y="201" font-size="23" font-weight="800" fill="#1e293b" font-family="'Courier New', Courier, monospace">task.create</text>
    <text x="1122" y="201" text-anchor="end" font-size="20" font-weight="600" fill="#334155">agent:triage</text>
  </g>
  <line x1="664" y1="226" x2="664" y2="242" stroke="#c2410c" stroke-width="3.5" marker-end="url(#arrowEmber)"/>
  <text x="688" y="241" font-size="18" font-weight="700" fill="#7c2d12" font-family="'Courier New', Courier, monospace">prev_hash</text>

  <g filter="url(#softShadow)">
    <rect x="640" y="248" width="504" height="58" rx="10" fill="#fff"/>
    <text x="662" y="285" font-size="23" font-weight="800" fill="#1e293b" font-family="'Courier New', Courier, monospace">artefact</text>
    <text x="1122" y="285" text-anchor="end" font-size="20" font-weight="600" fill="#334155">draft reply</text>
  </g>
  <line x1="664" y1="310" x2="664" y2="326" stroke="#c2410c" stroke-width="3.5" marker-end="url(#arrowEmber)"/>
  <text x="688" y="325" font-size="18" font-weight="700" fill="#7c2d12" font-family="'Courier New', Courier, monospace">prev_hash</text>

  <g filter="url(#softShadow)">
    <rect x="640" y="332" width="504" height="58" rx="10" fill="#fff"/>
    <text x="662" y="369" font-size="23" font-weight="800" fill="#1e293b" font-family="'Courier New', Courier, monospace">decide.override</text>
    <text x="1122" y="369" text-anchor="end" font-size="20" font-weight="600" fill="#334155">+ rationale</text>
  </g>

  <text x="640" y="428" font-size="20" font-weight="700" fill="#7c2d12">One call returns the chain:</text>
  <text x="640" y="456" font-size="21" font-weight="700" fill="#0f172a" font-family="'Courier New', Courier, monospace">chap.audit.read(task_id)</text>

  <rect x="640" y="476" width="504" height="82" rx="10" fill="#7c2d12"/>
  <text x="892" y="506" text-anchor="middle" font-size="18" font-weight="700" fill="#fed7aa" letter-spacing="2.5">TIME TO ANSWER</text>
  <text x="892" y="546" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">30 seconds</text>

  <text x="892" y="590" text-anchor="middle" font-size="20" font-weight="600" fill="#7c2d12" font-style="italic">every link verified, nothing to reconstruct</text>
</svg>
