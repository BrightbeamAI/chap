<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1240" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bgChaos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3f2"/>
      <stop offset="100%" stop-color="#fee4e2"/>
    </linearGradient>
    <linearGradient id="bgClean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <marker id="arrowEmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <text x="600" y="56" text-anchor="middle" font-size="46" font-weight="700" fill="#0f172a">Same scenario, two stacks</text>
  <text x="600" y="98" text-anchor="middle" font-size="28" font-weight="500" fill="#334155">a customer disputes a refund the agent decided last month</text>

  <rect x="30" y="126" width="1140" height="440" rx="16" fill="url(#bgChaos)" stroke="#f87171" stroke-width="2"/>
  <text x="600" y="176" text-anchor="middle" font-size="32" font-weight="800" fill="#7f1d1d" letter-spacing="3">WITHOUT CHAP</text>

  <g filter="url(#softShadow)">
    <rect x="55" y="200" width="360" height="110" rx="12" fill="#fff"/>
    <text x="235" y="246" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">OpenAI logs</text>
    <text x="235" y="284" text-anchor="middle" font-size="26" font-weight="700" fill="#b91c1c">expired after 30 days</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="425" y="200" width="360" height="110" rx="12" fill="#fff"/>
    <text x="605" y="246" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">Zendesk thread</text>
    <text x="605" y="284" text-anchor="middle" font-size="26" font-weight="700" fill="#b91c1c">final reply only</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="795" y="200" width="360" height="110" rx="12" fill="#fff"/>
    <text x="975" y="246" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">Slack #support</text>
    <text x="975" y="284" text-anchor="middle" font-size="26" font-weight="700" fill="#b91c1c">scrolled past</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="55" y="324" width="360" height="110" rx="12" fill="#fff"/>
    <text x="235" y="370" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">Linear comments</text>
    <text x="235" y="408" text-anchor="middle" font-size="26" font-weight="700" fill="#b91c1c">no rationale</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="425" y="324" width="360" height="110" rx="12" fill="#fff"/>
    <text x="605" y="370" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">webhook tail</text>
    <text x="605" y="408" text-anchor="middle" font-size="26" font-weight="700" fill="#b91c1c">keys rotated</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="795" y="324" width="360" height="110" rx="12" fill="#fff"/>
    <text x="975" y="370" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">Notion runbook</text>
    <text x="975" y="408" text-anchor="middle" font-size="26" font-weight="700" fill="#b91c1c">stale by Tuesday</text>
  </g>

  <text x="62" y="490" font-size="30" font-weight="600" fill="#1f2937" font-style="italic">"What did the agent draft?</text>
  <text x="62" y="528" font-size="30" font-weight="600" fill="#1f2937" font-style="italic">Why did we approve it?"</text>

  <rect x="630" y="456" width="510" height="96" rx="12" fill="#7f1d1d"/>
  <text x="885" y="492" text-anchor="middle" font-size="22" font-weight="700" fill="#fecaca" letter-spacing="3">TIME TO ANSWER</text>
  <text x="885" y="538" text-anchor="middle" font-size="48" font-weight="800" fill="#fff">~45 minutes</text>

  <rect x="30" y="590" width="1140" height="620" rx="16" fill="url(#bgClean)" stroke="#f97316" stroke-width="2"/>
  <text x="600" y="640" text-anchor="middle" font-size="32" font-weight="800" fill="#7c2d12" letter-spacing="3">WITH CHAP</text>

  <g filter="url(#softShadow)">
    <rect x="60" y="676" width="1080" height="84" rx="12" fill="#fff"/>
    <text x="84" y="730" font-size="30" font-weight="800" fill="#1e293b" font-family="'Courier New', Courier, monospace">task.create</text>
    <text x="1116" y="730" text-anchor="end" font-size="26" font-weight="600" fill="#334155">customer ticket · agent:triage</text>
  </g>
  <line x1="110" y1="762" x2="110" y2="784" stroke="#c2410c" stroke-width="4" marker-end="url(#arrowEmber)"/>
  <text x="140" y="782" font-size="22" font-weight="700" fill="#7c2d12" font-family="'Courier New', Courier, monospace">prev_hash</text>

  <g filter="url(#softShadow)">
    <rect x="60" y="790" width="1080" height="84" rx="12" fill="#fff"/>
    <text x="84" y="844" font-size="30" font-weight="800" fill="#1e293b" font-family="'Courier New', Courier, monospace">artefact</text>
    <text x="1116" y="844" text-anchor="end" font-size="26" font-weight="600" fill="#334155">draft reply · policy v3</text>
  </g>
  <line x1="110" y1="876" x2="110" y2="898" stroke="#c2410c" stroke-width="4" marker-end="url(#arrowEmber)"/>
  <text x="140" y="896" font-size="22" font-weight="700" fill="#7c2d12" font-family="'Courier New', Courier, monospace">prev_hash</text>

  <g filter="url(#softShadow)">
    <rect x="60" y="904" width="1080" height="84" rx="12" fill="#fff"/>
    <text x="84" y="958" font-size="30" font-weight="800" fill="#1e293b" font-family="'Courier New', Courier, monospace">decide.override</text>
    <text x="1116" y="958" text-anchor="end" font-size="26" font-weight="600" fill="#334155">+ rationale · tags · human:you</text>
  </g>

  <g>
    <rect x="60" y="1016" width="690" height="150" rx="12" fill="#0f172a"/>
    <text x="84" y="1062" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#fdba74">await chap.audit.read({</text>
    <text x="84" y="1102" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#f1f5f9">  task_id: <tspan fill="#86efac">"tsk_ticket_8821"</tspan></text>
    <text x="84" y="1142" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#fdba74">})</text>
  </g>

  <rect x="780" y="1016" width="360" height="150" rx="12" fill="#7c2d12"/>
  <text x="960" y="1074" text-anchor="middle" font-size="22" font-weight="700" fill="#fed7aa" letter-spacing="3">TIME TO ANSWER</text>
  <text x="960" y="1130" text-anchor="middle" font-size="46" font-weight="800" fill="#fff">30 seconds</text>
</svg>
