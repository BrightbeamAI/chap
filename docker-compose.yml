# One-command CHAP playground.
#
# Usage:
#   docker compose up
#   open http://localhost:8080
#
# The playground drafts with a scripted agent by default, so the full
# review, override and audit flow runs with no model download. Two browser
# tabs at the URL above demonstrate two humans on the same workspace.
#
# Optional: drafts from a model. Set CHAP_NO_LLM=0 and one of:
#   ANTHROPIC_API_KEY=... docker compose up
#   OPENAI_API_KEY=... docker compose up
#   OLLAMA_URL=http://host.docker.internal:11434 docker compose up
#     (install Ollama on the host and run: ollama pull gemma3:4b)

services:
  playground:
    build:
      context: .
      dockerfile: Dockerfile
    # SECURITY: playground has no authentication. Bound to 127.0.0.1
    # so it is reachable only from the host, never from the network.
    # If you really want to expose it on a LAN, replace with "8080:8080"
    # and add a reverse proxy with auth in front.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CHAP_NO_LLM: "${CHAP_NO_LLM:-1}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OLLAMA_URL:  "${OLLAMA_URL:-}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
    # On Linux hosts, uncomment to reach the host's Ollama at host.docker.internal:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
