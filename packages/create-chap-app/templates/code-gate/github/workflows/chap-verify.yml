# Every commit a pull request brings must have been approved through the
# CHAP code gate, under the trust policy the base branch holds.
#
# The check reads the pull request's commits as data and runs nothing from
# them: the verifier and the trust policy (chap-trust.json) come from the
# base branch, in a separate checkout, and the workflow itself runs on
# pull_request_target, so it is the base branch's copy of this file that
# runs. A pull request that edits the verifier, the policy or this file
# cannot change its own check; protect those paths with CODEOWNERS so the
# edits get a person's review when they land.
#
# The pull request's commits must be one line from the point where they
# leave the base branch, with no merge among them. Each was approved on the
# commit it sits on, so a pull request behind its base passes as it is; a
# rebased commit sits on a new parent and is proposed again. An approval
# already used anywhere in the base branch's history does not count again.
# Merge with a merge commit, which keeps the agent's commits, their
# signatures and their notes as they were verified; a squash or rebase merge
# writes new commits that carry none of them.
#
# Copy this file into the governed repository's .github/workflows/, commit
# the gate project at CHAP_GATE_DIR and chap-trust.json at the root, and
# make the job a required status check in the branch protection. Push the
# evidence notes with the commits (node <gate>/push-notes.mjs); the job
# fetches them from this repository.
name: CHAP code gate

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CHAP_GATE_DIR: tools/chap-gate
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: The base branch, which holds the verifier and the trust policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: The pull request's commits, read as data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      # The token reads this repository, private or public; it is passed to
      # these two fetches only, and never written to a checkout's config.
      - name: The base commit and the evidence notes from this repository
        working-directory: head
        env:
          TOKEN: ${{ github.token }}
          UPSTREAM: https://github.com/${{ github.repository }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=$AUTH" fetch --no-tags "$UPSTREAM" "$BASE_SHA"
          git -c "http.extraheader=$AUTH" fetch --no-tags "$UPSTREAM" "+refs/notes/chap:refs/notes/chap" || echo "no notes pushed yet"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Add --allow-people to accept commits that people signed with their own
      # SSH keys, when chap-trust.json lists those keys under "people".
      - name: Verify every commit of the pull request
        run: |
          node "base/$CHAP_GATE_DIR/verify.mjs" "$BASE_SHA..$HEAD_SHA" \
            --repo head \
            --base "$BASE_SHA" \
            --trust base/chap-trust.json \
            --require-signed-commit
