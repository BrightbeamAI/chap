[build-system]
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "chap-analytics"
version         = "0.2.0"
description     = "The record of a collaboration between people and agents, measured and drawn: a CHAP audit chain as documented tables, statistics with their intervals, graphs, charts, briefs and a self-contained interactive report"
readme          = "README.md"
requires-python = ">=3.10"
license         = "Apache-2.0"
license-files   = ["LICENSE"]
authors         = [{ name = "Brightbeam AI", email = "oss@brightbeam.com" }]
keywords        = ["chap", "audit", "analytics", "pandas", "human-in-the-loop", "agent", "vega-lite", "review", "provenance", "multi-agent"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# pandas is the point of the package. The coordinator stays dependency-free;
# this package serves a different audience with different habits. numpy is
# already a pandas dependency; it is named because stats and models call it.
dependencies = ["pandas>=2.0", "numpy>=1.23"]

[project.optional-dependencies]
# Reading a chain out of a live coordinator in-process, or generating the
# sample week, drives chap-coordinator. Reading a SqliteStore file, a JSON
# export or an HTTP endpoint needs the base install.
coordinator = ["chap-coordinator>=0.2.13"]
# Charts render in Jupyter without extras. Altair objects, and saving SVG
# or PNG without Node, come with viz.
viz         = ["altair>=5", "vl-convert-python>=1.0"]
# graph.to_networkx returns a networkx graph for further analysis.
graph       = ["networkx>=3"]
# Regenerating examples/chap_analytics_walkthrough.ipynb with its outputs.
notebook    = ["nbformat>=5", "nbclient>=0.9", "ipykernel>=6"]
dev         = ["pytest>=8", "chap-coordinator>=0.2.13", "nbformat>=5", "altair>=5", "networkx>=3"]

[project.urls]
Homepage      = "https://github.com/BrightbeamAI/chap/tree/main/packages/chap-analytics"
Repository    = "https://github.com/BrightbeamAI/chap"
Bugs          = "https://github.com/BrightbeamAI/chap/issues"
Changelog     = "https://github.com/BrightbeamAI/chap/blob/main/packages/chap-analytics/CHANGELOG.md"
Walkthrough   = "https://github.com/BrightbeamAI/chap/blob/main/packages/chap-analytics/examples/chap_analytics_walkthrough.ipynb"
Report        = "https://github.com/BrightbeamAI/chap/blob/main/packages/chap-analytics/docs/report.md"
Specification = "https://github.com/BrightbeamAI/chap/blob/main/SPECIFICATION.md"
Roadmap       = "https://github.com/BrightbeamAI/chap/blob/main/ANALYTICS_ROADMAP.md"

[tool.setuptools.packages.find]
include = ["chap_analytics*"]

[tool.setuptools.package-data]
"chap_analytics" = ["py.typed", "_vendor/*", "_report/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
