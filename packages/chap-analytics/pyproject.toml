[build-system]
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "chap-analytics"
version         = "0.1.0"
description     = "Project a CHAP audit chain into documented pandas tables for analysis"
readme          = "README.md"
requires-python = ">=3.10"
license         = "Apache-2.0"
authors         = [{ name = "Brightbeam AI", email = "oss@brightbeam.com" }]
keywords        = ["chap", "audit", "analytics", "pandas", "human-in-the-loop", "agent"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# pandas is the point of the package, not an optional extra. The coordinator
# stays dependency-free; this is a different audience with different habits.
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
# Only needed to read a chain out of a live coordinator in-process. Reading a
# SqliteStore file, a JSON export or an HTTP endpoint needs nothing extra.
coordinator = ["chap-coordinator>=0.2.13"]
dev         = ["pytest>=8", "chap-coordinator>=0.2.13"]

[project.urls]
Homepage      = "https://github.com/BrightbeamAI/chap"
Repository    = "https://github.com/BrightbeamAI/chap"
Specification = "https://github.com/BrightbeamAI/chap/blob/main/SPECIFICATION.md"
Roadmap       = "https://github.com/BrightbeamAI/chap/blob/main/ANALYTICS_ROADMAP.md"

[tool.setuptools.packages.find]
include = ["chap_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
