<text x="645.0" y="167.0" font-size="12" fill="#374151" text-anchor="middle">The workspace the chain belongs to.</text>
<rect x="500" y="260.0" width="290" height="70" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.6"/>
<text x="645.0" y="282.0" font-size="16" font-weight="600" fill="#1f4e79" text-anchor="middle">review</text>
<text x="645.0" y="303.0" font-size="12" fill="#374151" text-anchor="middle">One review pass on a task: the artefact</text>
<text x="645.0" y="318.0" font-size="12" fill="#374151" text-anchor="middle">under review and the reviewers asked.</text>
<rect x="500" y="396.0" width="290" height="70" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.6"/>
<text x="645.0" y="418.0" font-size="16" font-weight="600" fill="#1f4e79" text-anchor="middle">artefact</text>
<text x="645.0" y="439.0" font-size="12" fill="#374151" text-anchor="middle">A draft under review, or the corrected</text>
<text x="645.0" y="454.0" font-size="12" fill="#374151" text-anchor="middle">artefact an override produced.</text>
<rect x="500" y="532.0" width="290" height="70" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.6"/>
<text x="645.0" y="554.0" font-size="16" font-weight="600" fill="#1f4e79" text-anchor="middle">decision</text>
<text x="645.0" y="575.0" font-size="12" fill="#374151" text-anchor="middle">A reviewer's approve, reject, override or</text>
<text x="645.0" y="590.0" font-size="12" fill="#374151" text-anchor="middle">abstain on a review pass.</text>
<rect x="500" y="668.0" width="290" height="70" rx="8" fill="#e8eef6" stroke="#1f4e79" stroke-width="1.6"/>
<text x="645.0" y="690.0" font-size="16" font-weight="600" fill="#1f4e79" text-anchor="middle">task</text>
<text x="645.0" y="711.0" font-size="12" fill="#374151" text-anchor="middle">A unit of work with a lifecycle.</text>
<rect x="500" y="804.0" width="290" height="70" rx="8" fill="#f6f1dc" stroke="#7d6608" stroke-width="1.6"/>
<text x="645.0" y="826.0" font-size="16" font-weight="600" fill="#7d6608" text-anchor="middle">whisper</text>
<text x="645.0" y="847.0" font-size="12" fill="#374151" text-anchor="middle">A deadline-bound question an agent asked</text>
<text x="645.0" y="862.0" font-size="12" fill="#374151" text-anchor="middle">mid-task.</text>
<rect x="500" y="940.0" width="290" height="70" rx="8" fill="#f6f1dc" stroke="#7d6608" stroke-width="1.6"/>
<text x="645.0" y="962.0" font-size="16" font-weight="600" fill="#7d6608" text-anchor="middle">deliberation</text>
<text x="645.0" y="983.0" font-size="12" fill="#374151" text-anchor="middle">A multi-party vote.</text>
<rect x="500" y="1076.0" width="290" height="70" rx="8" fill="#f6f1dc" stroke="#7d6608" stroke-width="1.6"/>
<text x="645.0" y="1098.0" font-size="16" font-weight="600" fill="#7d6608" text-anchor="middle">handoff</text>
