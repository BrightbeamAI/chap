# Blank issues stay enabled on purpose. A chooser with no escape hatch forces
# people to file under whichever template is closest, which mislabels the
# issue and buries it.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/BrightbeamAI/chap/security/advisories/new
    about: Do not open a public issue. Use private vulnerability reporting, per SECURITY.md.
  - name: How changes get made
    url: https://github.com/BrightbeamAI/chap/blob/main/GOVERNANCE.md
    about: The issue to CEP to implementation path, label vocabulary, and voting thresholds.
  - name: Contributing
    url: https://github.com/BrightbeamAI/chap/blob/main/CONTRIBUTING.md
    about: Which changes take a pull request directly and which need a proposal.
