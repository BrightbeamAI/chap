name: Templates

# Every template is generated, installed from the published packages it
# pins, tested and run through diff-profiles, so a template never claims
# something the released coordinators do not do. chap-analytics is installed
# beside each, so the analytics script is tested on a store a template
# wrote. The profile explorer is rebuilt the same way and must match the
# committed file.

on:
  push:
    branches: [main]
    paths:
      - 'packages/create-chap-app/**'
      - 'docs/profile-explorer.md'
      - '.github/workflows/templates.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/create-chap-app/**'
      - 'docs/profile-explorer.md'
      - '.github/workflows/templates.yml'
  schedule:
    # Weekly, because the templates pin a range and a new patch release of
    # the packages reaches them without a change to this repository.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: templates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    name: The generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test the generator
        working-directory: packages/create-chap-app
        run: npm test

  typescript-templates:
    name: ${{ matrix.template }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: generator
    strategy:
      fail-fast: false
      matrix:
        template: [code-gate, mcp-gate, production]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chap-analytics for the analytics test
        run: python -m pip install chap-analytics
      - name: Git and OpenSSH for the code gate
        run: |
          git --version
          ssh -V
          git config --global user.name "CHAP templates CI"
          git config --global user.email "templates-ci@example.invalid"
      - name: Generate
        run: node packages/create-chap-app/index.mjs "my-${{ matrix.template }}" --template "${{ matrix.template }}" --yes --dir "${RUNNER_TEMP}/project"
      - name: Install the published packages
        working-directory: ${{ runner.temp }}/project
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: ${{ runner.temp }}/project
        run: npm test
      - name: diff-profiles
        working-directory: ${{ runner.temp }}/project
        run: node diff-profiles.mjs --against core/1.0

  python-templates:
    name: ${{ matrix.template }} on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    needs: generator
    strategy:
      fail-fast: false
      matrix:
        template: [support-desk, outbound-approval]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Generate
        run: node packages/create-chap-app/index.mjs "my-${{ matrix.template }}" --template "${{ matrix.template }}" --yes --dir "${RUNNER_TEMP}/project"
      - name: Install the published package
        working-directory: ${{ runner.temp }}/project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest chap-analytics
      - name: Prove the checkout is not on the import path
        working-directory: ${{ runner.temp }}/project
        run: |
          python - <<'PY'
          import pathlib, sys
          import chap_coordinator
          where = pathlib.Path(chap_coordinator.__file__).resolve()
          print("coordinator", chap_coordinator.__version__, "from", where)
          if "coordinator-py" in where.parts:
              sys.exit("the checkout is on sys.path; this job proves nothing")
          PY
      - name: Test
        working-directory: ${{ runner.temp }}/project
        run: python -m pytest tests -q
      - name: diff-profiles
        working-directory: ${{ runner.temp }}/project
        run: python diff-profiles.py --against core/1.0

  explorer:
    name: The profile explorer is up to date
    runs-on: ubuntu-latest
    needs: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the published Python package
        run: python -m pip install "chap-coordinator[crypto]>=0.3.0,<0.4"
      - name: Rebuild and compare
        env:
          CHAP_EXPLORER_INSTALL: '1'
        run: node packages/create-chap-app/scripts/build-explorer.mjs --check
