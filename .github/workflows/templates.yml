name: Templates

# Every template is generated, installed, tested and run through
# diff-profiles. On a push or a pull request a template installs the
# packages on that commit, packed and built as they would be published, so
# a release is tested before it is published. The weekly run installs the
# published packages the templates pin, so a template never claims something
# the released coordinators do not do. chap-analytics is installed beside
# each, so the analytics script is tested on a store a template wrote. The
# profile explorer is rebuilt from the coordinator on the commit and must
# match the committed file.

on:
  push:
    branches: [main]
    paths:
      - 'packages/create-chap-app/**'
      - 'packages/chap-server/**'
      - 'packages/chap-code-gate/**'
      - 'packages/coordinator/**'
      - 'packages/coordinator-mcp/**'
      - 'packages/coordinator-a2a/**'
      - 'packages/coordinator-py/**'
      - 'packages/chap-analytics/**'
      - 'docs/profile-explorer.md'
      - '.github/workflows/templates.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/create-chap-app/**'
      - 'packages/chap-server/**'
      - 'packages/chap-code-gate/**'
      - 'packages/coordinator/**'
      - 'packages/coordinator-mcp/**'
      - 'packages/coordinator-a2a/**'
      - 'packages/coordinator-py/**'
      - 'packages/chap-analytics/**'
      - 'docs/profile-explorer.md'
      - '.github/workflows/templates.yml'
  schedule:
    # Weekly, because the templates pin a range and a new patch release of
    # the packages reaches them without a change to this repository.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: templates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    name: The generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the generator
        working-directory: packages/create-chap-app
        run: npm test

  typescript-templates:
    name: ${{ matrix.template }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: generator
    strategy:
      fail-fast: false
      matrix:
        template: [code-gate, mcp-gate, production]
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install chap-analytics for the analytics test
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            python -m pip install chap-analytics
          else
            python -m pip install ./packages/chap-analytics
          fi
      - name: Pack the packages on this commit
        if: github.event_name != 'schedule'
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p "${RUNNER_TEMP}/packs"
          for p in coordinator coordinator-mcp coordinator-a2a chap-server chap-code-gate; do
            npm pack --silent --pack-destination "${RUNNER_TEMP}/packs" -w "packages/$p"
          done
      - name: Git and OpenSSH for the code gate
        run: |
          git --version
          ssh -V
          git config --global user.name "CHAP templates CI"
          git config --global user.email "templates-ci@example.invalid"
      - name: Generate
        run: node packages/create-chap-app/index.mjs "my-${{ matrix.template }}" --template "${{ matrix.template }}" --yes --dir "${RUNNER_TEMP}/project"
      - name: Install the packages
        working-directory: ${{ runner.temp }}/project
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund "${RUNNER_TEMP}"/packs/*.tgz
          fi
      - name: Test
        working-directory: ${{ runner.temp }}/project
        run: npm test
      - name: diff-profiles
        working-directory: ${{ runner.temp }}/project
        run: node diff-profiles.mjs --against core/1.0

  python-templates:
    name: ${{ matrix.template }} on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    needs: generator
    strategy:
      fail-fast: false
      matrix:
        template: [support-desk, outbound-approval]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Generate
        run: node packages/create-chap-app/index.mjs "my-${{ matrix.template }}" --template "${{ matrix.template }}" --yes --dir "${RUNNER_TEMP}/project"
      - name: Install the package
        working-directory: ${{ runner.temp }}/project
        run: |
          python -m pip install --upgrade pip build
          if [ "${{ github.event_name }}" != schedule ]; then
            python -m build --wheel --outdir "${RUNNER_TEMP}/wheels" "${GITHUB_WORKSPACE}/packages/coordinator-py"
            python -m pip install "${RUNNER_TEMP}"/wheels/chap_coordinator-*.whl "${GITHUB_WORKSPACE}/packages/chap-analytics"
          fi
          python -m pip install -r requirements.txt pytest chap-analytics
      - name: Prove the checkout is not on the import path
        working-directory: ${{ runner.temp }}/project
        run: |
          python - <<'PY'
          import pathlib, sys
          import chap_coordinator
          where = pathlib.Path(chap_coordinator.__file__).resolve()
          print("coordinator", chap_coordinator.__version__, "from", where)
          if "coordinator-py" in where.parts:
              sys.exit("the checkout is on sys.path; this job proves nothing")
          PY
      - name: Test
        working-directory: ${{ runner.temp }}/project
        run: python -m pytest tests -q
      - name: diff-profiles
        working-directory: ${{ runner.temp }}/project
        run: python diff-profiles.py --against core/1.0

  explorer:
    name: The profile explorer is up to date
    runs-on: ubuntu-latest
    needs: generator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the Python coordinator on this commit
        run: python -m pip install "./packages/coordinator-py[crypto]"
      - name: Rebuild and compare
        env:
          CHAP_EXPLORER_INSTALL: '1'
        run: node packages/create-chap-app/scripts/build-explorer.mjs --check
